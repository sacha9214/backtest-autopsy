[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backtest-autopsy"
version = "0.1.0"
description = "Was that Sharpe ratio skill, or the best of N coin flips?"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Sacha" }]
keywords = ["quantitative-finance", "backtesting", "overfitting", "sharpe-ratio"]
classifiers = [
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[project.optional-dependencies]
data = ["yfinance>=0.2.40"]
dev = ["pytest>=7.0"]

[project.scripts]
autopsy = "autopsy.cli:main"

[tool.setuptools.packages.find]
include = ["autopsy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
